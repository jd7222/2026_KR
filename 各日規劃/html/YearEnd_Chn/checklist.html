<header class="masthead">
  <div class="eyebrow">出发前的待办事项</div>
  <h1>行前<em>清单</em></h1>
  <p class="sub">分成两组：「赶快准备」是有时间压力、现在就该处理的事；「行前准备」是出发前一两周慢慢弄就好的事。勾选后自己心里有数，实际状态还是要以订购确认信为准。</p>
</header>

<div class="wrap">

<div class="section-title" id="urgent"><span class="idx">①</span><h2>赶快准备</h2></div>
<div class="card">
  <ul class="checklist">
    <li>
      <input type="checkbox" id="u1">
      <label for="u1">订🌼的机票：TPE→CNX（CI851）、CNX→曼谷国内线（泰国狮航）、曼谷→TPE 回程（泰航）
        <span class="due">越早订越便宜，旺季易涨价</span>
      </label>
    </li>
    <li>
      <input type="checkbox" id="u2">
      <label for="u2">订💩的机票：PVG→CNX（9C8511，16:15→20:15）、曼谷→PVG 回程（春秋）
        <span class="due">越早订越便宜，旺季易涨价</span>
      </label>
    </li>
    <li>
      <input type="checkbox" id="u3">
      <label for="u3">订清迈住宿（4 晚）与曼谷住宿（4 晚），两人的名字都登记上去
        <span class="due">建议 10 月底前订完</span>
      </label>
    </li>
    <li>
      <input type="checkbox" id="u4">
      <label for="u4">特别确认跨年夜（12/31）那晚的酒店——河滨房型旺季最先满，也常有加价或强制晚宴
        <span class="due">建议 10 月底前订完，务必事先确认是否有额外收费</span>
      </label>
    </li>
    <li>
      <input type="checkbox" id="u5">
      <label for="u5">12/28 四选一先决定：茵他侬 / 大象保护园 / 泰式料理课 / 情侣银戒手作
        <span class="due">大象保护园旺季名额少，需提前 1–2 个月预约</span>
      </label>
    </li>
    <li>
      <input type="checkbox" id="u6">
      <label for="u6">Wat Arun 情侣泰服写真，先联系店家确认造型师／摄影师档期</label>
    </li>
    <li>
      <input type="checkbox" id="u7">
      <label for="u7">两人各自投保旅游险，确认条款是否涵盖摩托车骑乘、大象园等活动</label>
    </li>
    <li>
      <input type="checkbox" id="u8">
      <label for="u8">🌼 到监理站申请国际驾照（IDP），才能合法在清迈租摩托车
        <span class="due">💩 持中国驾照目前无法申请泰国承认的国际驾照，建议由🌼主责骑车</span>
      </label>
    </li>
  </ul>
</div>

<div class="section-title" id="before"><span class="idx">②</span><h2>行前准备</h2></div>
<div class="card">
  <ul class="checklist">
    <li>
      <input type="checkbox" id="b1">
      <label for="b1">出发前 72 小时内填写泰国数字入境卡（TDAC）
        <span class="due">务必使用官方网站 tdac.immigration.go.th，注意坊间付费假网站</span>
      </label>
    </li>
    <li>
      <input type="checkbox" id="b2">
      <label for="b2">确认护照效期在 6 个月以上</label>
    </li>
    <li>
      <input type="checkbox" id="b3">
      <label for="b3">购买 eSIM（约 ¥60–100／8–10 天）</label>
    </li>
    <li>
      <input type="checkbox" id="b4">
      <label for="b4">下载离线版 Google 翻译（泰文包）与离线地图，以防网络不稳</label>
    </li>
    <li>
      <input type="checkbox" id="b5">
      <label for="b5">准备遮肩过膝的衣物——多个寺庙（契迪龙寺、银庙、双龙寺等）有服装要求</label>
    </li>
    <li>
      <input type="checkbox" id="b6">
      <label for="b6">准备一件轻薄外套应付早晚温差，若选茵他侬山顶只有 5–10°C 需更保暖</label>
    </li>
    <li>
      <input type="checkbox" id="b7">
      <label for="b7">换一些泰铢现金备用，并确认支付宝／微信支付／信用卡在当地都能用</label>
    </li>
    <li>
      <input type="checkbox" id="b8">
      <label for="b8">准备个人常备药（肠胃药、防蚊液、防晒乳）</label>
    </li>
    <li>
      <input type="checkbox" id="b9">
      <label for="b9">确认手机／相机的储存空间与电池，充电器与转接头都带上</label>
    </li>
    <li>
      <input type="checkbox" id="b10">
      <label for="b10">出发前再检查一次所有机票、酒店、体验活动的订购确认信是否都齐全</label>
    </li>
  </ul>
</div>

</div>
